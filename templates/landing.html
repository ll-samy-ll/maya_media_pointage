{% extends "base.html" %}
{% block title %}Accueil{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="text-center" style="max-width: 480px; width: 100%;">
        <h1 class="fw-bold mb-5 text-uppercase" style="letter-spacing: 1px;">{{ company_name }}</h1>

        <div class="row g-3 justify-content-center">
            <div class="col-6">
                <a href="{{ url_for('auth.login_employee') }}" class="btn landing-btn w-100">
                    Employé
                </a>
            </div>
            <div class="col-6">
                <a href="{{ url_for('auth.login_admin') }}" class="btn landing-btn landing-btn-highlight w-100">
                    Admin
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
