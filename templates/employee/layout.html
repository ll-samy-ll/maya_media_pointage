{% extends "base.html" %}
{% block content %}
<div class="d-flex" style="min-height:100vh;">

    <!-- Sidebar desktop -->
    <nav class="sidebar d-none d-md-flex flex-column p-3">
        <div class="mb-4 fw-bold fs-6 text-uppercase">{{ company_name }}</div>
        <a href="{{ url_for('employee.dashboard') }}" class="sidebar-link {% if active=='dashboard' %}active{% endif %}">
            <i class="bi bi-grid-1x2"></i> Tableau de bord
        </a>
        <a href="{{ url_for('employee.historiques') }}" class="sidebar-link {% if active=='historiques' %}active{% endif %}">
            <i class="bi bi-clock-history"></i> Historiques
        </a>
        <a href="{{ url_for('employee.retards') }}" class="sidebar-link {% if active=='retards' %}active{% endif %}">
            <i class="bi bi-alarm"></i> Retards
        </a>
    </nav>

    <!-- Sidebar mobile (offcanvas) -->
    <div class="offcanvas offcanvas-start sidebar-offcanvas" tabindex="-1" id="mobileSidebar">
        <div class="offcanvas-header">
            <span class="fw-bold text-uppercase">{{ company_name }}</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column p-3 pt-0">
            <a href="{{ url_for('employee.dashboard') }}" class="sidebar-link {% if active=='dashboard' %}active{% endif %}">
                <i class="bi bi-grid-1x2"></i> Tableau de bord
            </a>
            <a href="{{ url_for('employee.historiques') }}" class="sidebar-link {% if active=='historiques' %}active{% endif %}">
                <i class="bi bi-clock-history"></i> Historiques
            </a>
            <a href="{{ url_for('employee.retards') }}" class="sidebar-link {% if active=='retards' %}active{% endif %}">
                <i class="bi bi-alarm"></i> Retards
            </a>
        </div>
    </div>

    <div class="flex-grow-1">
        <header class="d-flex justify-content-between align-items-center p-3 border-bottom app-header">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-outline-secondary d-md-none" type="button"
                        data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">
                    <i class="bi bi-list"></i>
                </button>
                <span class="fw-bold d-md-none">{{ company_name }}</span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="small">{{ current_user.nom }}</span>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            </div>
        </header>

        <main class="p-3 p-md-4">
            {% block employee_content %}{% endblock %}
        </main>
    </div>
</div>
{% endblock %}
